[project]
name = "wabenwatt-hacs"
version = "0.6.0"
description = "Home Assistant integration that reports the live power of a PV plant, a home battery and a grid meter to wabenwatt.de"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
