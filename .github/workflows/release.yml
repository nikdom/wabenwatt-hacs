name: Release

# A release is a tag vX.Y.Z whose version equals the one in manifest.json.
# The GitHub release (what HACS offers as a version) is only created after
# that check and the test suite pass, so a mistagged commit never ships.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the manifest and pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/wabenwatt/manifest.json'))['version'])")
          pyproject=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag manifest=$manifest pyproject=$pyproject"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$pyproject" ]; then
            echo "::error::tag v$tag does not match manifest ($manifest) / pyproject ($pyproject)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: pytest

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
